<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal</title>
    <link rel="stylesheet" href="style.css">
    <script src='https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js'></script>
    <script type="module" src="app.js"></script>
</head>
<body>

<header>
    <h2>Student Portal</h2>

    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Courses</a></li>
            <li><a href="#">Profile</a></li>
            <li><a href="#">Grades</a></li>
        </ul>
    </nav>
</header>

<main>

    <section id="hero">
        <h1>Welcome to Student Portal</h1>
        <p>Discover courses, track your grades, and explore your learning journey.</p>
        <button>Explore Courses</button>
    </section>

    <section id="stats">
        <div class="stat">
            <h3>3</h3>
            <p>Courses Enrolled</p>
        </div>

        <div class="stat">
            <h3>3.8</h3>
            <p>GPA</p>
        </div>

        <div class="stat">
            <h3>6</h3>
            <p>Semester</p>
        </div>
    </section>

    <section id="notification">
        <div class="notification-grid">

        </div>
    </section>

    <section id="courses">

        <h2>Available Courses</h2>

        <input id="search-courses" placeholder="Search Courses...">
        <button id="sort-button">Sort by Credits</button>
        <div class="course-grid">

        </div>
        <p id="credits"></p>

    </section>

</main>

<footer>
    <p>&copy; 2026 Student Portal. All Rights Reserved.</p>
</footer>

</body>
</html>
