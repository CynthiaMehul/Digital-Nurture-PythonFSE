<h1>Course List</h1>

<input type="text" placeholder="Search Courses" [(ngModel)]="searchTerm">

<p *ngIf="loading">
  Loading courses...
</p>

<p *ngIf="!loading && filteredCourses.length === 0">
  No courses found
</p>

<app-course-card
    *ngFor="let course of filteredCourses"
    [name]="course.name"
    [code]="course.code"
    [credits]="course.credits"
    [grade]="course.grade">
</app-course-card>
